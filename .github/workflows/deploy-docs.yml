name: Docs pull request for GitHub Pages

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-open-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run build
        run: npm run build --if-present

      - name: Run lint
        run: npm run lint --if-present

      - name: Build docs
        run: npm run deploy:ghdocs

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DOCS_PR_TOKEN }}
          base: main
          branch: docs-update-${{ github.ref_name }}
          title: 'chore: update docs for GitHub Pages'
          body: |
            Atualiza o conteúdo versionado em `docs/` com o build mais recente da branch `${{ github.ref_name }}`.

            Mantenha este PR aberto até a revisão e merge em `main`, para que o GitHub Pages publique a versão nova.
          commit-message: 'chore: update docs for GitHub Pages'
